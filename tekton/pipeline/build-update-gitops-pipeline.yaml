apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build-update-gitops-pipeline
spec:
  description: Build container image and update GitOps manifest
  params:
  - name: git-url
    description: Git repository URL
    type: string
  - name: git-revision
    description: Git revision (branch)
    type: string
    default: main
  - name: image-name
    description: Container image name
    type: string
  - name: image-tag
    description: Container image tag
    type: string
  - name: manifest-path
    description: Path to kustomization.yaml
    type: string
    default: k8s/overlays/dev/kustomization.yaml
  workspaces:
  - name: shared-workspace
    description: Shared workspace for pipeline tasks
  tasks:
  - name: fetch-repository
    taskRef:
      name: git-clone
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.git-revision)
    workspaces:
    - name: output
      workspace: shared-workspace

  - name: build-app
    taskRef:
      name: maven-build
    runAfter:
    - fetch-repository
    workspaces:
    - name: source
      workspace: shared-workspace

  - name: build-push-image
    taskRef:
      name: buildah-push
    params:
    - name: image
      value: $(params.image-name):$(params.image-tag)
    runAfter:
    - build-app
    workspaces:
    - name: source
      workspace: shared-workspace

  - name: update-gitops-manifest
    taskRef:
      name: update-gitops-manifest
    params:
    - name: git-url
      value: $(params.git-url)
    - name: git-branch
      value: $(params.git-revision)
    - name: image-tag
      value: $(params.image-tag)
    - name: manifest-path
      value: $(params.manifest-path)
    runAfter:
    - build-push-image
    workspaces:
    - name: source
      workspace: shared-workspace
